version: '3.9'

services:
  db:
    image: postgres:17
    container_name: order_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data

  

    
  api:
    build: .
    container_name: order_api
    ports:
      - "8000:8000"
    restart: always
    env_file: .env
    depends_on: 
      - db
      

volumes:
  pg_data:
